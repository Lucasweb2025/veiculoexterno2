<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L.A. GESTÃO - TELEMETRIA CLOUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="la-firebase.js"></script>
    <style>
        :root { --orange: #f39c12; }
        body { background: #000; font-family: -apple-system, sans-serif; color: white; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; }
        #mapa-modal { height: 400px; width: 100%; border-radius: 15px; border: 1px solid var(--orange); }
        .modal-overlay { background: rgba(0,0,0,0.9); display: none; position: fixed; top:0; left:0; width:100%; height:100%; z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .filtro-label { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: #888; margin-bottom: 4px; }
        .filtro-input { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(243,156,18,0.35); background: rgba(255,255,255,0.05); color: #fff; font-size: 14px; outline: none; }
        .filtro-input:focus { border-color: var(--orange); }
        .btn-filtro { padding: 10px 16px; border-radius: 12px; font-size: 11px; font-weight: 800; text-transform: uppercase; cursor: pointer; border: none; }
        .btn-filtro-aplicar { background: var(--orange); color: #000; }
        .btn-filtro-limpar { background: transparent; color: #aaa; border: 1px solid #444; }
    </style>
</head>
<body class="min-h-screen">

    <!-- TELA DE LOGIN -->
    <div id="painel-login" class="flex items-center justify-center min-h-screen p-4">
        <div class="text-center w-full max-w-xs">
            <img src="https://i.ibb.co/27cxGcb1/lacustomlogotipo.png" class="h-16 mx-auto mb-6" style="filter: drop-shadow(0 0 12px rgba(243, 156, 18, 0.4));">
            <h2 class="text-[--orange] text-sm font-black uppercase tracking-wider mb-6">Painel de Gestão</h2>
            <label class="block text-left text-zinc-500 text-[10px] font-bold uppercase mb-1 ml-1">E-mail</label>
            <input type="email" id="email-painel" placeholder="seu@email.com" autocomplete="username"
                onkeypress="if(event.key==='Enter') loginPainel()"
                class="w-full p-4 rounded-xl border border-[--orange] bg-white/5 text-white text-lg mb-3 outline-none">
            <label class="block text-left text-zinc-500 text-[10px] font-bold uppercase mb-1 ml-1">Senha</label>
            <input type="password" id="senha-painel" placeholder="Senha" autocomplete="current-password" onkeypress="if(event.key==='Enter') loginPainel()"
                class="w-full p-4 rounded-xl border border-[--orange] bg-white/5 text-white text-lg mb-4 outline-none">
            <button type="button" id="btn-login-painel" onclick="loginPainel()" class="w-full p-4 rounded-full border-2 border-[--orange] text-[--orange] font-bold uppercase tracking-wider hover:bg-[--orange] hover:text-black transition-all">Acessar</button>
        </div>
    </div>

    <!-- CONTEÚDO DO PAINEL -->
    <div id="painel-content" class="p-4" style="display: none;">

        <!-- Modal do Mapa -->
        <div id="overlay" class="modal-overlay">
            <div class="w-full max-w-2xl bg-zinc-900 p-6 rounded-3xl relative">
                <button onclick="fecharMapa()" class="absolute -top-10 right-0 text-white font-bold uppercase text-xs">Fechar [X]</button>
                <h3 id="modal-titulo" class="text-[--orange] font-black uppercase mb-4 italic">Trajeto da Viagem</h3>
                <div id="mapa-modal"></div>
            </div>
        </div>

        <header class="max-w-5xl mx-auto mb-8 flex justify-between items-center border-b border-white/10 pb-6">
            <div>
                <img src="https://i.ibb.co/27cxGcb1/lacustomlogotipo.png" class="h-10 mb-2">
                <h1 class="text-[--orange] font-black text-sm uppercase tracking-tighter italic">Gestão de Telemetria</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="window.location.reload()" class="bg-zinc-900 border border-white/10 px-4 py-2 rounded-xl text-xs font-bold">F5</button>
                <button onclick="logoutPainel()" class="bg-zinc-900 border border-red-500/30 text-red-400 px-4 py-2 rounded-xl text-xs font-bold">Sair</button>
            </div>
        </header>

        <main class="max-w-3xl mx-auto space-y-6">
            <section>
                <h2 class="text-zinc-500 text-[10px] font-black uppercase tracking-widest mb-4 ml-2">Histórico de Movimentação</h2>

                <div class="card mb-4 space-y-3">
                    <div class="text-[--orange] text-[10px] font-black uppercase tracking-wider">Filtros</div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="filtro-label" for="filtro-motorista">Motorista</label>
                            <select id="filtro-motorista" class="filtro-input">
                                <option value="todos">Todos</option>
                            </select>
                        </div>
                        <div>
                            <label class="filtro-label" for="filtro-destino">Destino</label>
                            <select id="filtro-destino" class="filtro-input">
                                <option value="todos">Todos</option>
                            </select>
                        </div>
                        <div>
                            <label class="filtro-label" for="filtro-data-inicio">Data início</label>
                            <input type="date" id="filtro-data-inicio" class="filtro-input">
                        </div>
                        <div>
                            <label class="filtro-label" for="filtro-data-fim">Data fim</label>
                            <input type="date" id="filtro-data-fim" class="filtro-input">
                        </div>
                    </div>
                    <div class="flex gap-2 flex-wrap">
                        <button type="button" class="btn-filtro btn-filtro-aplicar" onclick="aplicarFiltros()">Filtrar</button>
                        <button type="button" class="btn-filtro btn-filtro-limpar" onclick="limparFiltros()">Limpar</button>
                    </div>
                </div>

                <div id="lista-viagens" class="space-y-3"></div>
            </section>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const db = laDb();
        let map, polyline;
        const tripCache = {};
        const tripNames = {};
        let handlerTrips = null;
        let tripsAll = {};
        let filtrosAtivos = { motorista: 'todos', destino: 'todos', dataInicio: '', dataFim: '' };

        function mostrarPainelLogado() {
            document.getElementById('painel-login').style.display = 'none';
            document.getElementById('painel-content').style.display = 'block';
            iniciarEscutaTrips();
        }

        function mostrarPainelLogin() {
            document.getElementById('painel-login').style.display = 'flex';
            document.getElementById('painel-content').style.display = 'none';
            pararEscutaTrips();
        }

        laObservarAuth(mostrarPainelLogado, mostrarPainelLogin);

        async function loginPainel() {
            const email = document.getElementById('email-painel').value;
            const senha = document.getElementById('senha-painel').value;
            const btn = document.getElementById('btn-login-painel');
            if (!email.trim() || !senha) return alert('Preencha e-mail e senha.');
            btn.disabled = true;
            btn.textContent = 'Entrando...';
            try {
                await laEntrar(email, senha);
                document.getElementById('senha-painel').value = '';
            } catch (err) {
                alert(laMensagemErroAuth(err));
            } finally {
                btn.disabled = false;
                btn.textContent = 'Acessar';
            }
        }

        async function logoutPainel() {
            pararEscutaTrips();
            await laSair();
            location.reload();
        }

        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str || '---';
            return d.innerHTML;
        }

        function normalizarTexto(s) {
            return (s || '').trim().toLowerCase();
        }

        function parseTripDate(str) {
            if (!str) return null;
            const parte = String(str).split(',')[0].trim();
            const p = parte.split('/');
            if (p.length !== 3) return null;
            const d = parseInt(p[0], 10), m = parseInt(p[1], 10) - 1, y = parseInt(p[2], 10);
            if (!d || m < 0 || !y) return null;
            return new Date(y, m, d);
        }

        function parseInputDate(val) {
            if (!val) return null;
            const p = val.split('-').map(Number);
            if (p.length !== 3) return null;
            return new Date(p[0], p[1] - 1, p[2]);
        }

        function diaMs(date) {
            return new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
        }

        function tripNoPeriodo(trip, inicio, fim) {
            const td = parseTripDate(trip.date);
            if (!inicio && !fim) return true;
            if (!td) return false;
            const t = diaMs(td);
            if (inicio && fim) return t >= diaMs(inicio) && t <= diaMs(fim);
            if (inicio) return t === diaMs(inicio);
            if (fim) return t <= diaMs(fim);
            return true;
        }

        function matchMotorista(trip, filtro) {
            if (!filtro || filtro === 'todos') return true;
            return normalizarTexto(trip.driver) === normalizarTexto(filtro);
        }

        function matchDestino(trip, filtro) {
            if (!filtro || filtro === 'todos') return true;
            const f = normalizarTexto(filtro);
            const dest = normalizarTexto(trip.destino);
            const id = normalizarTexto(trip.destinoId);
            return dest === f || id === f || dest.includes(f);
        }

        function tripPassaFiltro(trip) {
            const inicio = parseInputDate(filtrosAtivos.dataInicio);
            const fim = parseInputDate(filtrosAtivos.dataFim);
            return matchMotorista(trip, filtrosAtivos.motorista)
                && matchDestino(trip, filtrosAtivos.destino)
                && tripNoPeriodo(trip, inicio, fim);
        }

        function preencherSelect(id, valores, valorAtual) {
            const sel = document.getElementById(id);
            if (!sel) return;
            const atual = valorAtual || sel.value || 'todos';
            sel.innerHTML = '<option value="todos">Todos</option>';
            valores.sort((a, b) => a.localeCompare(b, 'pt-BR')).forEach(v => {
                const opt = document.createElement('option');
                opt.value = v;
                opt.textContent = v;
                sel.appendChild(opt);
            });
            if (atual !== 'todos' && valores.some(v => normalizarTexto(v) === normalizarTexto(atual))) {
                sel.value = valores.find(v => normalizarTexto(v) === normalizarTexto(atual)) || 'todos';
            } else {
                sel.value = 'todos';
            }
        }

        function atualizarOpcoesFiltro() {
            const motoristas = new Set();
            const destinos = new Set();
            Object.values(tripsAll).forEach(trip => {
                if (trip.driver) motoristas.add(String(trip.driver).trim());
                if (trip.destino) destinos.add(String(trip.destino).trim());
            });
            preencherSelect('filtro-motorista', [...motoristas], filtrosAtivos.motorista);
            preencherSelect('filtro-destino', [...destinos], filtrosAtivos.destino);
        }

        function renderizarListaViagens() {
            const container = document.getElementById('lista-viagens');
            container.innerHTML = '';
            const entries = Object.entries(tripsAll)
                .filter(([, trip]) => tripPassaFiltro(trip))
                .reverse();

            if (!entries.length) {
                container.innerHTML = '<p class="text-zinc-500 text-sm text-center py-8">Nenhuma viagem neste filtro.</p>';
                return;
            }

            entries.forEach(([id, trip]) => {
                tripCache[id] = trip.path || [];
                tripNames[id] = trip.car || '---';
                const carName = esc(trip.car);
                const driverName = esc(trip.driver);
                const date = esc(trip.date);
                const km = parseFloat(trip.km || 0).toFixed(2);
                const motivoCorrida = esc(trip.motivoCorrida || '—');
                const destinoTxt = esc(trip.destino || '—');

                container.innerHTML += `
                    <div class="card border-l-2 border-l-zinc-700 hover:border-l-[--orange] transition-all">
                        <div class="flex justify-between items-center">
                            <div>
                                <div class="text-[#f39c12] font-black text-lg">${carName}</div>
                                <div class="text-white font-bold text-sm uppercase">${driverName}</div>
                                <div class="text-zinc-400 text-[11px] mt-1">Destino: <span class="text-white">${destinoTxt}</span></div>
                                <div class="text-zinc-300 text-[11px] mt-1">Motivo: <span class="text-white">${motivoCorrida}</span></div>
                                <div class="text-zinc-500 text-[10px] mt-1">${date}</div>
                            </div>
                            <div class="text-right flex flex-col items-end gap-2">
                                <div class="text-white font-black text-lg">+${km} KM</div>
                                <button type="button" onclick="abrirMapaPorId('${id}')" class="bg-[--orange] text-black text-[10px] font-black px-3 py-1 rounded uppercase">Ver Rota</button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function aplicarFiltros() {
            const dataInicio = document.getElementById('filtro-data-inicio').value;
            const dataFim = document.getElementById('filtro-data-fim').value;
            const inicio = parseInputDate(dataInicio);
            const fim = parseInputDate(dataFim);
            if (inicio && fim && diaMs(fim) < diaMs(inicio)) {
                return alert('Data fim não pode ser antes da data início.');
            }
            filtrosAtivos = {
                motorista: document.getElementById('filtro-motorista').value,
                destino: document.getElementById('filtro-destino').value,
                dataInicio,
                dataFim
            };
            renderizarListaViagens();
        }

        function limparFiltros() {
            document.getElementById('filtro-motorista').value = 'todos';
            document.getElementById('filtro-destino').value = 'todos';
            document.getElementById('filtro-data-inicio').value = '';
            document.getElementById('filtro-data-fim').value = '';
            filtrosAtivos = { motorista: 'todos', destino: 'todos', dataInicio: '', dataFim: '' };
            renderizarListaViagens();
        }

        function iniciarEscutaTrips() {
            if (handlerTrips) return;
            handlerTrips = function (snapshot) {
                tripsAll = snapshot.val() || {};
                atualizarOpcoesFiltro();
                renderizarListaViagens();
            };
            db.ref('trips').on('value', handlerTrips);
        }

        function pararEscutaTrips() {
            if (!handlerTrips) return;
            db.ref('trips').off('value', handlerTrips);
            handlerTrips = null;
        }

        function abrirMapaPorId(tripId) {
            abrirMapa(tripCache[tripId] || [], tripNames[tripId] || '---');
        }

        function abrirMapa(path, car) {
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('modal-titulo').innerText = `Rota: ${car}`;

            if (!map) {
                map = L.map('mapa-modal', { zoomControl: false }).setView([-23.55, -46.63], 13);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            }

            if (polyline) map.removeLayer(polyline);

            if (path && path.length > 0) {
                polyline = L.polyline(path, {color: '#f39c12', weight: 4}).addTo(map);
                map.fitBounds(polyline.getBounds());
            }
            
            setTimeout(() => map.invalidateSize(), 300);
        }

        function fecharMapa() {
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
