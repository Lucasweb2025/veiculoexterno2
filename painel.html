<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <title>L.A. Controle - Painel</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="la-config.js"></script>
    <script src="assets/js/la-backend-loader.js"></script>
    <script src="assets/js/la-store.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/gestor-auth.js"></script>

    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/painel.css">
</head>
<body>

    <div class="painel-shell">
        <!-- LOGIN -->
        <div id="painel-login">
            <div class="login-wrap">
                <img src="https://i.ibb.co/27cxGcb1/lacustomlogotipo.png" class="login-logo" alt="L.A.">
                <p class="login-sub">Painel de gestÃ£o â€” telemetria</p>
                <div class="login-card">
                    <label class="field-label" for="email-painel">E-mail</label>
                    <input type="email" id="email-painel" class="input" placeholder="seu@email.com" autocomplete="username"
                        onkeypress="if(event.key==='Enter') loginPainel()">
                    <label class="field-label" for="senha-painel">Senha</label>
                    <input type="password" id="senha-painel" class="input" placeholder="Senha" autocomplete="current-password"
                        onkeypress="if(event.key==='Enter') loginPainel()">
                    <button type="button" id="btn-login-painel" class="btn btn-yellow" onclick="loginPainel()">Entrar</button>
                    <button type="button" class="btn-ghost" onclick="window.location.href='index.html'">App motorista</button>
                </div>
            </div>
        </div>

        <!-- PAINEL -->
        <div id="painel-content">
            <header class="top-bar">
                <div>
                    <img src="https://i.ibb.co/27cxGcb1/lacustomlogotipo.png" class="top-logo" alt="L.A.">
                    <h1>L.A. Controle</h1>
                    <div class="sub">GestÃ£o de telemetria</div>
                </div>
                <div class="top-actions">
                    <button type="button" class="btn-top" onclick="window.location.reload()">Atualizar</button>
                    <button type="button" class="btn-top btn-top-danger" onclick="logoutPainel()">Sair</button>
                </div>
            </header>

            <main class="main-painel">
                <p class="section-title">Alertas de veÃ­culo</p>
                <div id="lista-alertas" class="lista-alertas"></div>

                <p class="section-title">RevisÃ£o e manutenÃ§Ã£o</p>
                <div class="card" style="margin-bottom:16px;">
                    <div class="card-filtros-title">Registrar manutenÃ§Ã£o (gestor)</div>
                    <div class="manut-form-grid">
                        <div>
                            <label class="filtro-label" for="manut-painel-veiculo">VeÃ­culo</label>
                            <select id="manut-painel-veiculo" class="filtro-input"></select>
                        </div>
                        <div>
                            <label class="filtro-label" for="manut-painel-data">Data</label>
                            <input type="date" id="manut-painel-data" class="filtro-input">
                        </div>
                        <div>
                            <label class="filtro-label" for="manut-painel-tipo">Tipo</label>
                            <select id="manut-painel-tipo" class="filtro-input">
                                <option value="revisao">RevisÃ£o geral</option>
                                <option value="freio">Freio</option>
                                <option value="oleo">Ã“leo</option>
                                <option value="pneu">Pneu</option>
                                <option value="outro">Outro</option>
                            </select>
                        </div>
                        <div>
                            <label class="filtro-label" for="manut-painel-desc">O que foi feito</label>
                            <input type="text" id="manut-painel-desc" class="filtro-input" maxlength="300" placeholder="DescriÃ§Ã£o da manutenÃ§Ã£o">
                        </div>
                        <div>
                            <label class="filtro-label" for="manut-painel-km">Km</label>
                            <input type="number" id="manut-painel-km" class="filtro-input" min="0" placeholder="Opcional">
                        </div>
                        <div>
                            <label class="filtro-label" for="manut-painel-oficina">Oficina</label>
                            <input type="text" id="manut-painel-oficina" class="filtro-input" maxlength="80" placeholder="Opcional">
                        </div>
                        <div>
                            <label class="filtro-label" for="manut-painel-custo">Custo (R$)</label>
                            <input type="number" id="manut-painel-custo" class="filtro-input" min="0" step="0.01" placeholder="Opcional">
                        </div>
                    </div>
                    <button type="button" class="btn-manut-salvar" onclick="salvarManutencaoPainel()">Salvar manutenÃ§Ã£o</button>
                </div>
                <div id="lista-manutencoes" class="lista-manutencoes"></div>

                <p class="section-title">HistÃ³rico de movimentaÃ§Ã£o</p>

                <div class="card">
                    <div class="card-filtros-title">Filtros</div>
                    <div class="filtro-grid">
                        <div>
                            <label class="filtro-label" for="filtro-motorista">Motorista</label>
                            <select id="filtro-motorista" class="filtro-input"><option value="todos">Todos</option></select>
                        </div>
                        <div>
                            <label class="filtro-label" for="filtro-veiculo">VeÃ­culo</label>
                            <select id="filtro-veiculo" class="filtro-input"><option value="todos">Todos</option></select>
                        </div>
                        <div>
                            <label class="filtro-label" for="filtro-destino">Destino</label>
                            <select id="filtro-destino" class="filtro-input"><option value="todos">Todos</option></select>
                        </div>
                        <div>
                            <label class="filtro-label" for="filtro-data-inicio">Data inÃ­cio</label>
                            <input type="date" id="filtro-data-inicio" class="filtro-input">
                        </div>
                        <div>
                            <label class="filtro-label" for="filtro-data-fim">Data fim</label>
                            <input type="date" id="filtro-data-fim" class="filtro-input">
                        </div>
                    </div>
                    <div class="filtro-btns">
                        <button type="button" class="btn-filtro btn-filtro-aplicar" onclick="aplicarFiltros()">Filtrar</button>
                        <button type="button" class="btn-filtro btn-filtro-limpar" onclick="limparFiltros()">Limpar</button>
                        <button type="button" class="btn-filtro btn-filtro-exportar" onclick="exportarViagensCsv()">Exportar CSV</button>
                    </div>
                </div>

                <div id="lista-viagens" class="lista-viagens"></div>
                <div id="paginacao" class="paginacao" aria-label="PaginaÃ§Ã£o do histÃ³rico"></div>
            </main>
        </div>
    </div>

    <div id="overlay" class="modal-overlay">
        <div class="modal-box">
            <button type="button" class="modal-close" onclick="fecharMapa()">Fechar âœ•</button>
            <h3 id="modal-titulo" class="modal-titulo">Trajeto da viagem</h3>
            <div id="mapa-modal"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        let unsubTrips = null;
        let unsubIssues = null;
        let unsubManut = null;
        let map, polyline;
        const tripCache = {};
        const tripNames = {};
        let tripsAll = {};
        let issuesAll = {};
        let manutAll = {};
        const MANUT_TIPO_LABEL = {
            revisao: 'RevisÃ£o geral', freio: 'Freio', oleo: 'Ã“leo', pneu: 'Pneu', outro: 'Outro'
        };
        const ISSUE_TIPO_LABEL = {
            freio: 'Freio', barulho: 'Barulho', pneu: 'Pneu',
            luz: 'Luz no painel', vazamento: 'Vazamento', outro: 'Outro'
        };
        const ISSUE_URGENCIA_LABEL = {
            leve: 'Leve', atencao: 'AtenÃ§Ã£o', nao_usar: 'NÃ£o usar'
        };
        let filtrosAtivos = { motorista: 'todos', veiculo: 'todos', destino: 'todos', dataInicio: '', dataFim: '' };
        const ITENS_POR_PAGINA = 10;
        let paginaAtual = 1;

        async function laAposLoginPainel() {
            iniciarEscutaTrips();
            iniciarEscutaIssues();
            iniciarEscutaManutencoes();
            const dataManut = document.getElementById('manut-painel-data');
            if (dataManut && !dataManut.value) dataManut.value = new Date().toISOString().slice(0, 10);
        }

        function laAoSairPainel() {
            pararEscutaTrips();
            pararEscutaIssues();
            pararEscutaManutencoes();
        }

        function tripNoPeriodo(trip, inicio, fim) {
            const td = parseTripDate(trip.date);
            if (!inicio && !fim) return true;
            if (!td) return false;
            const t = diaMs(td);
            if (inicio && fim) return t >= diaMs(inicio) && t <= diaMs(fim);
            if (inicio) return t === diaMs(inicio);
            if (fim) return t <= diaMs(fim);
            return true;
        }

        function matchMotorista(trip, filtro) {
            if (!filtro || filtro === 'todos') return true;
            return normalizarTexto(trip.driver) === normalizarTexto(filtro);
        }

        function matchDestino(trip, filtro) {
            if (!filtro || filtro === 'todos') return true;
            const f = normalizarTexto(filtro);
            const dest = normalizarTexto(trip.destino);
            const id = normalizarTexto(trip.destinoId);
            return dest === f || id === f || dest.includes(f);
        }

        function matchVeiculo(trip, filtro) {
            if (!filtro || filtro === 'todos') return true;
            return normalizarTexto(trip.car) === normalizarTexto(filtro);
        }

        function tripPassaFiltro(trip) {
            const inicio = parseInputDate(filtrosAtivos.dataInicio);
            const fim = parseInputDate(filtrosAtivos.dataFim);
            return matchMotorista(trip, filtrosAtivos.motorista)
                && matchVeiculo(trip, filtrosAtivos.veiculo)
                && matchDestino(trip, filtrosAtivos.destino)
                && tripNoPeriodo(trip, inicio, fim);
        }

        function preencherSelect(id, valores, valorAtual) {
            const sel = document.getElementById(id);
            if (!sel) return;
            const atual = valorAtual || sel.value || 'todos';
            sel.innerHTML = '<option value="todos">Todos</option>';
            valores.sort((a, b) => a.localeCompare(b, 'pt-BR')).forEach(v => {
                const opt = document.createElement('option');
                opt.value = v;
                opt.textContent = v;
                sel.appendChild(opt);
            });
            if (atual !== 'todos' && valores.some(v => normalizarTexto(v) === normalizarTexto(atual))) {
                sel.value = valores.find(v => normalizarTexto(v) === normalizarTexto(atual)) || 'todos';
            } else {
                sel.value = 'todos';
            }
        }

        function atualizarOpcoesFiltro() {
            const motoristas = new Set();
            const veiculos = new Set();
            const destinos = new Set();
            Object.values(tripsAll).forEach(trip => {
                if (trip.driver) motoristas.add(String(trip.driver).trim());
                if (trip.car) veiculos.add(String(trip.car).trim());
                if (trip.destino) destinos.add(String(trip.destino).trim());
            });
            preencherSelect('filtro-motorista', [...motoristas], filtrosAtivos.motorista);
            preencherSelect('filtro-veiculo', [...veiculos], filtrosAtivos.veiculo);
            preencherSelect('filtro-destino', [...destinos], filtrosAtivos.destino);
        }

        function obterViagensFiltradas() {
            return Object.entries(tripsAll)
                .filter(([, trip]) => tripPassaFiltro(trip))
                .reverse();
        }

        function renderizarPaginacao(total, totalPaginas) {
            const pagEl = document.getElementById('paginacao');
            if (!pagEl) return;
            if (totalPaginas <= 1) {
                pagEl.style.display = 'none';
                pagEl.innerHTML = '';
                return;
            }
            const inicio = (paginaAtual - 1) * ITENS_POR_PAGINA + 1;
            const fim = Math.min(paginaAtual * ITENS_POR_PAGINA, total);
            pagEl.style.display = 'flex';
            pagEl.innerHTML = `
                <button type="button" class="btn-pagina" onclick="irPaginaAnterior()" ${paginaAtual <= 1 ? 'disabled' : ''}>Anterior</button>
                <div class="paginacao-info">
                    PÃ¡gina <b>${paginaAtual}</b> de <b>${totalPaginas}</b><br>
                    <span>${inicio}â€“${fim} de ${total}</span>
                </div>
                <button type="button" class="btn-pagina" onclick="irPaginaProxima()" ${paginaAtual >= totalPaginas ? 'disabled' : ''}>PrÃ³xima</button>`;
        }

        function irPaginaAnterior() {
            if (paginaAtual <= 1) return;
            paginaAtual--;
            renderizarListaViagens();
            document.querySelector('.main-painel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function irPaginaProxima() {
            const totalPaginas = Math.ceil(obterViagensFiltradas().length / ITENS_POR_PAGINA);
            if (paginaAtual >= totalPaginas) return;
            paginaAtual++;
            renderizarListaViagens();
            document.querySelector('.main-painel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function formatarTiposIssue(tipos) {
            if (!tipos || !tipos.length) return 'Problema';
            return tipos.map(t => ISSUE_TIPO_LABEL[t] || t).join(', ');
        }

        function atualizarSelectVeiculosManut() {
            const sel = document.getElementById('manut-painel-veiculo');
            if (!sel) return;
            const veiculos = new Set();
            Object.values(issuesAll).forEach(i => { if (i.vehicleId) veiculos.add(i.vehicleId); });
            Object.keys(manutAll).forEach(v => veiculos.add(v));
            Object.values(tripsAll).forEach(t => { if (t.car) veiculos.add(String(t.car).trim()); });
            const lista = [...veiculos].filter(Boolean).sort();
            const atual = sel.value;
            sel.innerHTML = lista.length
                ? lista.map(v => '<option value="' + esc(v) + '">' + esc(v) + '</option>').join('')
                : '<option value="UNO">UNO</option><option value="MONTANA">MONTANA</option>';
            if (atual && lista.includes(atual)) sel.value = atual;
        }

        function renderizarListaManutencoes() {
            const container = document.getElementById('lista-manutencoes');
            if (!container) return;
            const entries = [];
            Object.entries(manutAll).forEach(([vehicleId, regs]) => {
                if (!regs) return;
                Object.entries(regs).forEach(([id, m]) => {
                    entries.push({ vehicleId, id, m });
                });
            });
            entries.sort((a, b) => String(b.m.criadoEm || b.m.date || '').localeCompare(String(a.m.criadoEm || a.m.date || '')));
            if (!entries.length) {
                container.innerHTML = '<p class="empty-msg">Nenhuma manutenÃ§Ã£o registrada.</p>';
                return;
            }
            container.innerHTML = '';
            entries.slice(0, 20).forEach(({ vehicleId, m }) => {
                const tipo = esc(MANUT_TIPO_LABEL[m.tipo] || m.tipo || 'ManutenÃ§Ã£o');
                const car = esc(m.vehicleName || vehicleId);
                const data = esc((m.date || 'â€”').split(',')[0]);
                const desc = esc(m.descricao || 'â€”');
                let extra = '';
                if (m.km) extra += 'Km: <b>' + esc(String(m.km)) + '</b> Â· ';
                if (m.oficina) extra += esc(m.oficina) + ' Â· ';
                if (m.custo) extra += 'R$ ' + esc(String(m.custo));
                container.innerHTML += `
                    <div class="manut-card">
                        <div class="manut-titulo">${car} â€” ${tipo}</div>
                        <div class="manut-meta">${data}</div>
                        <div class="manut-meta">${desc}</div>
                        ${extra ? '<div class="manut-meta">' + extra + '</div>' : ''}
                        ${m.registradoPor ? '<div class="manut-meta"><small>' + esc(m.registradoPor) + '</small></div>' : ''}
                    </div>`;
            });
            atualizarSelectVeiculosManut();
        }

        function iniciarEscutaManutencoes() {
            if (unsubManut) return;
            unsubManut = laEscutarManutencoesPainel(function (val) {
                manutAll = val || {};
                renderizarListaManutencoes();
            });
        }

        function pararEscutaManutencoes() {
            if (!unsubManut) return;
            unsubManut();
            unsubManut = null;
        }

        async function salvarManutencaoPainel() {
            const vehicleId = document.getElementById('manut-painel-veiculo').value;
            const tipo = document.getElementById('manut-painel-tipo').value;
            const descricao = (document.getElementById('manut-painel-desc').value || '').trim();
            const dataVal = document.getElementById('manut-painel-data').value;
            const km = document.getElementById('manut-painel-km').value;
            const oficina = (document.getElementById('manut-painel-oficina').value || '').trim();
            const custo = document.getElementById('manut-painel-custo').value;
            if (!vehicleId || !descricao) return alert('Preencha veÃ­culo e descriÃ§Ã£o.');
            const btn = document.querySelector('.btn-manut-salvar');
            if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
            try {
                const dataFmt = dataVal
                    ? new Date(dataVal + 'T12:00:00').toLocaleDateString('pt-BR')
                    : new Date().toLocaleDateString('pt-BR');
                await laSalvarManutencaoVeiculo(vehicleId, {
                    vehicleName: vehicleId,
                    tipo: tipo,
                    descricao: descricao,
                    date: dataFmt,
                    km: km ? parseFloat(km) : null,
                    oficina: oficina || null,
                    custo: custo ? parseFloat(custo) : null,
                    role: 'gestor'
                });
                document.getElementById('manut-painel-desc').value = '';
                document.getElementById('manut-painel-km').value = '';
                document.getElementById('manut-painel-oficina').value = '';
                document.getElementById('manut-painel-custo').value = '';
                alert('ManutenÃ§Ã£o salva.');
            } catch (e) {
                alert('NÃ£o foi possÃ­vel salvar. Verifique a internet e tente de novo.');
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = 'Salvar manutenÃ§Ã£o'; }
            }
        }

        function renderizarListaAlertas() {
            const container = document.getElementById('lista-alertas');
            if (!container) return;
            const entries = Object.entries(issuesAll)
                .sort((a, b) => {
                    const sa = (a[1].status === 'resolvido') ? 1 : 0;
                    const sb = (b[1].status === 'resolvido') ? 1 : 0;
                    if (sa !== sb) return sa - sb;
                    return (b[1].date || '').localeCompare(a[1].date || '');
                });
            if (!entries.length) {
                container.innerHTML = '<p class="empty-msg">Nenhum alerta de veÃ­culo.</p>';
                return;
            }
            container.innerHTML = '';
            entries.forEach(([id, issue]) => {
                const critico = issue.urgencia === 'nao_usar';
                const resolvido = issue.status === 'resolvido';
                const tipos = esc(formatarTiposIssue(issue.tipos));
                const urg = esc(ISSUE_URGENCIA_LABEL[issue.urgencia] || issue.urgencia || 'â€”');
                const car = esc(issue.vehicleName || issue.vehicleId || 'â€”');
                const driver = esc(issue.driver || 'â€”');
                const desc = issue.descricao ? esc(issue.descricao) : '';
                const data = esc(issue.date || 'â€”');
                const status = esc(issue.status || 'aberto');
                const btn = resolvido ? '' :
                    '<button type="button" class="btn-issue-resolver" onclick="marcarIssueResolvido(\'' + id + '\')">Marcar resolvido</button>';
                container.innerHTML += `
                    <div class="issue-card${critico ? ' critico' : ''}${resolvido ? ' resolvido' : ''}">
                        <div class="issue-car">${car}</div>
                        <div class="issue-meta">Motorista: <b>${driver}</b></div>
                        <div class="issue-meta">Problema: <b>${tipos}</b></div>
                        ${desc ? '<div class="issue-meta">' + desc + '</div>' : ''}
                        <div class="issue-meta">${data}</div>
                        <span class="issue-badge${critico ? ' critico' : ''}">${urg} Â· ${status}</span>
                        ${btn}
                    </div>`;
            });
        }

        async function marcarIssueResolvido(issueId) {
            if (!issueId) return;
            try {
                await laResolverIssue(issueId);
            } catch (e) {
                alert('NÃ£o foi possÃ­vel atualizar. Tente de novo.');
            }
        }

        function iniciarEscutaIssues() {
            if (unsubIssues) return;
            unsubIssues = laEscutarIssues(function (val) {
                issuesAll = val || {};
                renderizarListaAlertas();
            });
        }

        function pararEscutaIssues() {
            if (!unsubIssues) return;
            unsubIssues();
            unsubIssues = null;
        }

        function renderizarListaViagens() {
            const container = document.getElementById('lista-viagens');
            container.innerHTML = '';
            const entries = obterViagensFiltradas();
            const total = entries.length;
            const totalPaginas = Math.max(1, Math.ceil(total / ITENS_POR_PAGINA));

            if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
            if (paginaAtual < 1) paginaAtual = 1;

            if (!total) {
                paginaAtual = 1;
                container.innerHTML = '<p class="empty-msg">Nenhuma viagem neste filtro.</p>';
                renderizarPaginacao(0, 0);
                return;
            }

            const offset = (paginaAtual - 1) * ITENS_POR_PAGINA;
            const paginaEntries = entries.slice(offset, offset + ITENS_POR_PAGINA);

            paginaEntries.forEach(([id, trip]) => {
                tripCache[id] = trip.path || [];
                tripNames[id] = trip.car || '---';
                const carName = esc(trip.car);
                const driverName = esc(trip.driver);
                const date = esc(trip.date);
                const km = parseFloat(trip.km || 0).toFixed(2);
                const motivoCorrida = esc(trip.motivoCorrida || 'â€”');
                const destinoTxt = esc(trip.destino || 'â€”');

                container.innerHTML += `
                    <div class="trip-card">
                        <div class="trip-row">
                            <div>
                                <div class="trip-car">${carName}</div>
                                <div class="trip-driver">${driverName}</div>
                                <div class="trip-meta">Destino: <b>${destinoTxt}</b></div>
                                <div class="trip-meta">Motivo: <b>${motivoCorrida}</b></div>
                                <div class="trip-meta">${date}</div>
                            </div>
                            <div style="text-align:right">
                                <div class="trip-km">+${km} km</div>
                                <button type="button" class="btn-ver-rota" onclick="abrirMapaPorId('${id}')">Ver rota</button>
                            </div>
                        </div>
                    </div>`;
            });

            renderizarPaginacao(total, totalPaginas);
        }

        function aplicarFiltros() {
            const dataInicio = document.getElementById('filtro-data-inicio').value;
            const dataFim = document.getElementById('filtro-data-fim').value;
            const inicio = parseInputDate(dataInicio);
            const fim = parseInputDate(dataFim);
            if (inicio && fim && diaMs(fim) < diaMs(inicio)) {
                return alert('Data fim nÃ£o pode ser antes da data inÃ­cio.');
            }
            filtrosAtivos = {
                motorista: document.getElementById('filtro-motorista').value,
                veiculo: document.getElementById('filtro-veiculo').value,
                destino: document.getElementById('filtro-destino').value,
                dataInicio,
                dataFim
            };
            paginaAtual = 1;
            renderizarListaViagens();
        }

        function limparFiltros() {
            document.getElementById('filtro-motorista').value = 'todos';
            document.getElementById('filtro-veiculo').value = 'todos';
            document.getElementById('filtro-destino').value = 'todos';
            document.getElementById('filtro-data-inicio').value = '';
            document.getElementById('filtro-data-fim').value = '';
            filtrosAtivos = { motorista: 'todos', veiculo: 'todos', destino: 'todos', dataInicio: '', dataFim: '' };
            paginaAtual = 1;
            renderizarListaViagens();
        }

        function csvCelula(val) {
            const s = val == null ? '' : String(val);
            return '"' + s.replace(/"/g, '""') + '"';
        }

        function exportarViagensCsv() {
            const entries = obterViagensFiltradas();
            if (!entries.length) return alert('Nenhuma viagem para exportar com os filtros atuais.');
            const cabecalho = ['id', 'veiculo', 'motorista', 'destino', 'destino_id', 'motivo', 'km', 'duracao', 'data', 'pontos_rota'];
            const linhas = [cabecalho.join(';')];
            entries.forEach(function ([id, trip]) {
                linhas.push([
                    csvCelula(id),
                    csvCelula(trip.car),
                    csvCelula(trip.driver),
                    csvCelula(trip.destino),
                    csvCelula(trip.destinoId),
                    csvCelula(trip.motivoCorrida),
                    csvCelula(parseFloat(trip.km || 0).toFixed(2)),
                    csvCelula(trip.time),
                    csvCelula(trip.date),
                    csvCelula((trip.path && trip.path.length) || 0)
                ].join(';'));
            });
            const blob = new Blob(['\ufeff' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const hoje = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = 'la-controle-viagens-' + hoje + '.csv';
            a.click();
            URL.revokeObjectURL(url);
        }

        function iniciarEscutaTrips() {
            if (unsubTrips) return;
            unsubTrips = laEscutarTrips(function (val) {
                tripsAll = val || {};
                atualizarOpcoesFiltro();
                renderizarListaViagens();
            });
        }

        function pararEscutaTrips() {
            if (!unsubTrips) return;
            unsubTrips();
            unsubTrips = null;
        }

        function abrirMapaPorId(tripId) {
            abrirMapa(tripCache[tripId] || [], tripNames[tripId] || '---');
        }

        function abrirMapa(path, car) {
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('modal-titulo').innerText = 'Rota: ' + car;

            if (!map) {
                map = L.map('mapa-modal', { zoomControl: false }).setView([-23.55, -46.63], 13);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
            }

            if (polyline) map.removeLayer(polyline);

            if (path && path.length > 0) {
                polyline = L.polyline(path, { color: '#276EF1', weight: 5 }).addTo(map);
                map.fitBounds(polyline.getBounds(), { padding: [24, 24] });
            }

            setTimeout(() => map.invalidateSize(), 300);
        }

        function fecharMapa() {
            document.getElementById('overlay').style.display = 'none';
        }

        iniciarSessaoPainel();
    </script>
</body>
</html>
