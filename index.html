<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://i.ibb.co/27cxGcb1/lacustomlogotipo.png">
    <title>L.A. CONTROLE V.34</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root { --orange: #f39c12; --dark: #000; --red: #e74c3c; --green: #27ae60; }
        html, body { margin: 0; padding: 0; background: var(--dark); color: white; font-family: -apple-system, sans-serif; height: 100%; width: 100%; overflow: hidden; }
        .bg { position: fixed; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); z-index: 0; }
        .container { display: flex; flex-direction: column; height: 100dvh; padding: 20px; box-sizing: border-box; align-items: center; z-index: 1; position: relative; }
        .header { width: 100%; text-align: center; padding: 10px 0; }
        .logo { height: 60px; filter: drop-shadow(0 0 12px rgba(243, 156, 18, 0.4)); }
        .input-login { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid var(--orange); background: rgba(255,255,255,0.05); color: white; margin-bottom: 15px; text-align: center; font-size: 1.1rem; box-sizing: border-box; }
        .selector { width: 100%; flex-grow: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; overflow: hidden;}
        .car-visual { max-width: 90%; max-height: 160px; filter: drop-shadow(0 15px 25px rgba(243, 156, 18, 0.5)); border-radius: 15px; }
        .odo-box { background: rgba(255,255,255,0.05); padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; margin-top: 10px; border: 1px solid var(--orange); }
        .btn { width: 100%; max-width: 300px; padding: 16px; border-radius: 40px; border: 2px solid var(--orange); background: transparent; color: var(--orange); font-weight: bold; text-transform: uppercase; cursor: pointer; }
        .btn-start { background: var(--green); border: none; color: white; margin-top: 10px; }
        .btn-stop { background: var(--red); border: none; color: white; margin-top: 10px; }
        #map { width: 100%; flex-grow: 1; border-radius: 20px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.1); }
        .stats { width: 100%; display: flex; justify-content: space-around; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; }
        .stat b { display: block; font-size: 1.3rem; color: var(--orange); }
        .driver-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.1); font-weight: bold; cursor: pointer; width: 100%; }
        .btn-logout { background: none; border: none; color: #555; font-size: 0.7rem; margin-top: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .polyline-live { stroke: #f39c12; }
    </style>
</head>
<body onload="verificarSessao()">
    <div class="bg"></div>

    <div id="tela-login" class="container">
        <div class="header"><img src="https://i.ibb.co/27cxGcb1/lacustomlogotipo.png" class="logo"></div>
        <div style="text-align: center; width: 100%; max-width: 300px; margin-top: 50px;">
            <h2 style="color: var(--orange); font-size: 1.1rem; margin-bottom: 20px;">L.A. PORTFÓLIO CLOUD</h2>
            <input type="password" id="senha-acesso" class="input-login" placeholder="Senha Master" onkeypress="if(event.key==='Enter') validarLogin()">
            <button class="btn" onclick="validarLogin()">Acessar Sistema</button>
        </div>
    </div>

    <div id="app-content" style="display: none;">
        <div id="tela-veiculo" class="container">
            <div class="header"><img src="https://i.ibb.co/27cxGcb1/lacustomlogotipo.png" class="logo"></div>
            <div class="selector">
                <div id="car-render"></div>
                <h2 id="car-name" style="color: var(--orange); font-size: 1.2rem; margin-top: 10px;">---</h2>
                <div id="car-odo" class="odo-box">Odômetro Cloud: 0.00 km</div>
            </div>
            <div style="display: flex; gap: 40px; margin-bottom: 20px;">
                <button onclick="mudar(-1)" style="background:none; border:none; color:white; font-size: 2.5rem;">❮</button>
                <button onclick="mudar(1)" style="background:none; border:none; color:white; font-size: 2.5rem;">❯</button>
            </div>
            <button class="btn" onclick="proximaTela('tela-veiculo', 'tela-motorista')">Selecionar Motorista</button>
            <button class="btn-logout" onclick="logout()">Sair do Sistema</button>
        </div>

        <div id="tela-motorista" class="container" style="display:none;">
            <div class="header"><img src="https://i.ibb.co/27cxGcb1/lacustomlogotipo.png" class="logo"></div>
            <h3 style="margin-bottom:20px;">Identificação</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%;">
                <div id="card-Marco" class="driver-card" onclick="setDriver(this, 'Marco')">Marco</div>
                <div id="card-Fabio" class="driver-card" onclick="setDriver(this, 'Fabio')">Fabio</div>
            </div>
            <button class="btn btn-start" style="margin-top: auto;" onclick="initOperation()">Confirmar Saída</button>
            <button onclick="location.reload()" style="background:none; border:none; color:#555; margin: 10px 0;">Sair</button>
        </div>

        <div id="tela-mapa" class="container" style="display:none;">
            <div class="stats">
                <div class="stat"><small>ESTA VIAGEM</small><b id="km">0.00</b><small>KM</small></div>
                <div class="stat"><small>TEMPO</small><b id="tempo">00:00</b></div>
            </div>
            <div id="map"></div>
            <button id="btn-master" class="btn btn-start" onclick="toggleTracking()">Iniciar Rastreio</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        const firebaseConfig = {
            apiKey: "AIzaSyB4wDK8VddBeOOrfndLd7LemSGDPupKjF0",
            authDomain: "la-controle.firebaseapp.com",
            databaseURL: "https://la-controle-default-rtdb.firebaseio.com",
            projectId: "la-controle",
            storageBucket: "la-controle.firebasestorage.app",
            messagingSenderId: "847252305513",
            appId: "1:847252305513:web:d2caa9b0404806ea8794f8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const SENHA_MESTRA = "LACUSTOM2026";
        const TRIP_BACKUP_KEY = 'la_trip_backup_v34';
        const ORS_KEY = "5b3ce3597851110001cf6248f29a41aab5a84830a5a434027bbfeba8";
        const GPS_ACCURACY_LIMIT = 30;
        const fleet = [
            { id: "UNO", nome: "UNO VIVACE", foto: "https://i.ibb.co/4Lq2XH7/UNO.jpg" },
            { id: "MONTANA", nome: "MONTANA", foto: "https://i.ibb.co/Lht7bLY1/montanta.jpg" }
        ];

        let idx = 0, driver = "", running = false, dist = 0, path = [], watch, map, marker, polyline, startTime, timer, wakeLock = null;
        let currentOdoRef = null, checkInterval = null;
        const CHECK_HOURS = 4;

        function validarLogin() {
            if(document.getElementById('senha-acesso').value.trim().toUpperCase() === SENHA_MESTRA) {
                localStorage.setItem('sessao_la_cloud', 'ativa');
                document.getElementById('tela-login').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                mudar(0);
                verificarViagemPendente();
            } else { alert("Senha Incorreta!"); }
        }

        function verificarSessao() {
            if(localStorage.getItem('sessao_la_cloud') === 'ativa') {
                document.getElementById('tela-login').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                mudar(0);
                verificarViagemPendente();
            }
        }

        function logout() {
            if (running) return alert("Finalize a corrida antes de sair!");
            localStorage.removeItem('sessao_la_cloud');
            localStorage.removeItem(TRIP_BACKUP_KEY);
            location.reload();
        }

        function verificarViagemPendente() {
            const backup = localStorage.getItem(TRIP_BACKUP_KEY);
            if (!backup) return;

            const data = JSON.parse(backup);
            if (confirm(`Viagem anterior não finalizada!\n${data.car} - ${data.driver}\n${data.km.toFixed(2)} km percorridos\n\nDeseja salvar esta viagem?`)) {
                salvarViagemRecuperada(data);
            } else {
                localStorage.removeItem(TRIP_BACKUP_KEY);
            }
        }

        async function salvarViagemRecuperada(data) {
            try {
                const trip = { car: data.car, driver: data.driver, km: data.km, time: data.time, date: data.date, path: data.path };
                await db.ref('vehicles/' + data.carId + '/status').set("DISPONÍVEL");
                await db.ref('vehicles/' + data.carId + '/odometer').transaction(c => (c || 0) + data.km);
                db.ref('trips').push(trip);
                localStorage.removeItem(TRIP_BACKUP_KEY);
                alert("Viagem recuperada e salva com sucesso!");
            } catch (e) {
                alert("Erro ao salvar viagem recuperada. Tente novamente.");
            }
        }

        function salvarBackupViagem() {
            if (!running) return;
            const backup = {
                carId: fleet[idx].id, car: fleet[idx].nome, driver,
                km: parseFloat((dist / 1000).toFixed(2)),
                time: document.getElementById('tempo').innerText,
                date: new Date().toLocaleString('pt-BR'),
                path, startTime
            };
            localStorage.setItem(TRIP_BACKUP_KEY, JSON.stringify(backup));
        }

        function formatarTempo(ms) {
            const totalSecs = Math.floor(ms / 1000);
            const h = Math.floor(totalSecs / 3600);
            const m = Math.floor((totalSecs % 3600) / 60);
            const s = totalSecs % 60;
            if (h > 0) return String(h).padStart(2,'0') + ":" + String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0');
            return String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0');
        }

        function mudar(n) {
            if (currentOdoRef) currentOdoRef.off('value');

            idx = (idx + n + fleet.length) % fleet.length;
            document.getElementById('car-render').innerHTML = `<img src="${fleet[idx].foto}" class="car-visual">`;
            document.getElementById('car-name').innerText = fleet[idx].nome;

            currentOdoRef = db.ref('vehicles/' + fleet[idx].id + '/odometer');
            currentOdoRef.on('value', s => {
                document.getElementById('car-odo').innerText = `Odômetro Cloud: ${(s.val() || 0).toFixed(2)} km`;
            });
        }

        function proximaTela(a, p) { document.getElementById(a).style.display = 'none'; document.getElementById(p).style.display = 'flex'; }

        function setDriver(el, n) {
            document.querySelectorAll('.driver-card').forEach(c => c.style.borderColor = 'rgba(255,255,255,0.1)');
            el.style.borderColor = 'var(--orange)'; driver = n;
        }

        function initOperation() {
            if (!driver) return alert("Selecione o motorista!");
            proximaTela('tela-motorista', 'tela-mapa');
            map = L.map('map', { zoomControl: false }).setView([-23.55, -46.63], 16);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            marker = L.circleMarker([0,0], {radius: 9, color: '#f39c12', fillOpacity: 1, weight: 3}).addTo(map);
            polyline = L.polyline([], {color: '#f39c12', weight: 3, opacity: 0.7}).addTo(map);
            setTimeout(() => map.invalidateSize(), 400);
        }

        async function toggleTracking() {
            const btn = document.getElementById('btn-master');
            const carId = fleet[idx].id;

            if (!running) {
                try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
                running = true; btn.innerText = "Finalizar Corrida"; btn.className = "btn btn-stop";
                startTime = Date.now();
                db.ref('vehicles/' + carId + '/status').set("EM MOVIMENTO");

                window.addEventListener('beforeunload', alertaFechar);

                checkInterval = setInterval(() => {
                    const hrs = Math.floor((Date.now() - startTime) / 3600000);
                    if (hrs > 0 && hrs % CHECK_HOURS === 0) {
                        if (confirm(`Corrida ativa há ${hrs} horas!\n${fleet[idx].nome} - ${driver}\n${(dist/1000).toFixed(2)} km\n\nDeseja finalizar agora?`)) {
                            fecharCorrida();
                        }
                    }
                }, 60000);

                timer = setInterval(() => {
                    document.getElementById('tempo').innerText = formatarTempo(Date.now() - startTime);
                    salvarBackupViagem();
                }, 1000);

                watch = navigator.geolocation.watchPosition(p => {
                    if (p.coords.accuracy > GPS_ACCURACY_LIMIT) return;

                    const pos = [p.coords.latitude, p.coords.longitude];
                    if (path.length > 0) {
                        const last = path[path.length - 1];
                        const d = L.latLng(last).distanceTo(pos);
                        if (d < 2 || d > 500) return;
                        dist += d;
                    }
                    path.push(pos);
                    marker.setLatLng(pos);
                    polyline.addLatLng(pos);
                    map.flyTo(pos, 17);
                    document.getElementById('km').innerText = (dist / 1000).toFixed(2);

                    db.ref('vehicles/' + carId + '/last_pos').set({
                        lat: p.coords.latitude, lng: p.coords.longitude,
                        driver, km_atual: (dist / 1000).toFixed(2),
                        last_update: new Date().toLocaleString('pt-BR')
                    });
                }, err => {
                    if (err.code === 1) alert("Permissão de GPS negada. Ative a localização e tente novamente.");
                    else if (err.code === 2) alert("GPS indisponível. Verifique o sinal.");
                    else alert("Erro ao obter localização. Tente novamente.");
                }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
            } else {
                if (!confirm("Deseja realmente finalizar a corrida?")) return;
                fecharCorrida();
            }
        }

        function alertaFechar(e) {
            e.preventDefault();
            e.returnValue = '';
        }

        function pararRastreio() {
            if (watch) { navigator.geolocation.clearWatch(watch); watch = null; }
            if (timer) { clearInterval(timer); timer = null; }
            if (checkInterval) { clearInterval(checkInterval); checkInterval = null; }
            if (wakeLock) { try { wakeLock.release(); } catch(e) {} wakeLock = null; }
            window.removeEventListener('beforeunload', alertaFechar);
        }

        function amostragemPath(pontos, max) {
            if (pontos.length <= max) return pontos;
            const result = [pontos[0]];
            const step = (pontos.length - 1) / (max - 1);
            for (let i = 1; i < max - 1; i++) result.push(pontos[Math.round(i * step)]);
            result.push(pontos[pontos.length - 1]);
            return result;
        }

        async function snapToRoad(rawPath) {
            if (rawPath.length < 2) return rawPath;

            const sampled = amostragemPath(rawPath, 50);
            const coords = sampled.map(p => [p[1], p[0]]);

            try {
                const res = await fetch('https://api.openrouteservice.org/v2/directions/driving-car/geojson', {
                    method: 'POST',
                    headers: { 'Authorization': ORS_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ coordinates: coords, radiuses: coords.map(() => 50) })
                });

                if (!res.ok) return rawPath;

                const data = await res.json();
                const geometry = data.features[0].geometry.coordinates;
                return geometry.map(c => [c[1], c[0]]);
            } catch (e) {
                return rawPath;
            }
        }

        async function fecharCorrida() {
            const btn = document.getElementById('btn-master');
            btn.disabled = true; btn.innerText = "Ajustando rota...";

            pararRastreio();

            const snappedPath = await snapToRoad(path);

            btn.innerText = "Salvando...";

            let kmSnapped = 0;
            for (let i = 1; i < snappedPath.length; i++) {
                kmSnapped += L.latLng(snappedPath[i - 1]).distanceTo(snappedPath[i]);
            }
            const kmFinal = parseFloat((kmSnapped / 1000).toFixed(2));

            const carId = fleet[idx].id;
            const trip = { car: fleet[idx].nome, driver, km: kmFinal, time: document.getElementById('tempo').innerText, date: new Date().toLocaleString('pt-BR'), path: snappedPath };

            try {
                await db.ref('vehicles/' + carId + '/status').set("DISPONÍVEL");
                await db.ref('vehicles/' + carId + '/odometer').transaction(c => (c || 0) + kmFinal);
                db.ref('trips').push(trip);

                localStorage.removeItem(TRIP_BACKUP_KEY);
                alert("Viagem Finalizada!\nDistância: " + kmFinal + " km");
                location.reload();
            } catch (e) {
                alert("Erro ao sincronizar. O odômetro será atualizado na próxima conexão.");
                location.reload();
            }
        }
    </script>
</body>
</html>
